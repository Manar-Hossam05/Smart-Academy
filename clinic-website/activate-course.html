<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفعيل الكورس | Ebtessam Nada-AVM</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="active-course.css">
</head>
<body>

    <div class="activation-wrapper">
        <div class="activation-card">
            <div class="icon-header">
                <i class="fas fa-unlock-alt"></i>
            </div>

            <h2>تفعيل المحتوى التعليمي</h2>
            <p>برجاء إدخال كود التفعيل أو رقم عملية التحويل (InstaPay) لتتمكن من البدء في الدراسة.</p>

            <div class="input-container">
                <i class="fas fa-terminal"></i>
                <input type="text" id="code" placeholder="أدخل الكود هنا..." autocomplete="off">
            </div>

            <button id="activate-btn" onclick="checkCode()">
                <span class="btn-text">تفعيل الكورس الآن</span>
                <i class="fas fa-arrow-left"></i>
            </button>

            <p class="error-msg" id="error"></p>

            <div class="support-info">
                <span>تواجه مشكلة؟</span>
                <a href="https://wa.me/yournumber" target="_blank"></a>
            </div>
        </div>
    </div>

    <script src="active-course.js"></script>
</body>
</html>
