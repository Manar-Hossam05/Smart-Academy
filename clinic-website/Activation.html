<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activate Your Course - AVM Academy</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="activation.css">
</head>
<body>

    <div class="activation-wrapper">
        <div class="activation-card">
            <div class="card-header">
                <div class="icon-circle">
                    <i class="fas fa-unlock-alt"></i>
                </div>
                <h1>Course Activation</h1>
                <p>Enter the unique code you received via WhatsApp/Email to unlock your content.</p>
            </div>

            <form id="activation-form">
                <div class="input-group">
                    <label for="activation-code">Activation Code</label>
                    <div class="input-wrapper">
                        <i class="fas fa-key"></i>
                        <input type="text" id="activation-code" placeholder="AVM-XXXX-XXXX" required>
                    </div>
                </div>

                <button type="submit" class="btn-activate">
                    <span>Activate Now</span>
                    <i class="fas fa-rocket"></i>
                </button>
            </form>

            <div class="card-footer">
                <p>Didn't receive a code yet?</p>
                <a href="https://wa.me/YOUR_NUMBER" class="contact-support">
                    <i class="fab fa-whatsapp"></i> Contact Support
                </a>
            </div>
        </div>
        <a href="Home.html" class="back-home">Back to Home Page</a>
    </div>

</body>
</html>
